name: Independent kernel check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  nanoda:
    name: lean4export + nanoda
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore cslib build outputs
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages/cslib-frontier/.lake
            .lake/packages/cslib/.lake
          key: cslib-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: cslib-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Get the Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build Vendor Monteverde Audit

      - name: Export and check with nanoda
        run: scripts/kernel_check.sh 2>&1 | tee kernel-check.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-check-log
          path: kernel-check.log
