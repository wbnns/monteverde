name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore cslib build outputs
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages/cslib-frontier/.lake
            .lake/packages/cslib/.lake
          key: cslib-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: cslib-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Get the Mathlib cache
        run: lake exe cache get

      - name: Build
        run: |
          set -o pipefail
          lake build Vendor Monteverde Audit Tests 2>&1 | tee build.log

      - name: No sorry and no new axioms
        run: |
          if grep -E "declaration uses .sorry." build.log; then
            echo "A declaration uses sorry."; exit 1
          fi
          if grep -rnE "^\s*(private |protected )?axiom " --include=*.lean Vendor Monteverde Tests Audit CrossCheck 2>/dev/null; then
            echo "The project must not declare axioms."; exit 1
          fi

      - name: Vendored files match upstream
        run: scripts/diff_vendor.sh

      - name: Statement isolation (imports)
        run: scripts/check_isolation.sh

      - name: Show the audit results
        run: |
          lake env lean Audit/Axioms.lean
          lake env lean Audit/Isolation.lean

  cross-check:
    # The Cook-Levin cross-check from the design doc. It is a test, not part of the claim, so it
    # runs as its own job: it builds the vendored millennium-cook-levin proof, which is large.
    name: Cook-Levin cross-check
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore cslib build outputs
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages/cslib-frontier/.lake
            .lake/packages/cslib/.lake
          key: cslib-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: cslib-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Get the Mathlib cache
        run: lake exe cache get

      - name: Build the cross-check (fails on an axiom outside the allowlist)
        run: |
          set -o pipefail
          lake build CrossCheck 2>&1 | tee build.log
          if grep -E "declaration uses .sorry." build.log; then
            echo "A declaration uses sorry."; exit 1
          fi
          lake env lean CrossCheck/Axioms.lean
