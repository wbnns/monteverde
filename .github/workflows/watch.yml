name: Weekly watch for related work

# The design doc's first risk: someone else publishes the same link first. Its mitigation is a
# weekly look at cslib-frontier issues and pull requests and at konard/p-vs-np. This job does
# that search and opens an issue in this repository when it finds something. The design doc also
# names the Lean Zulip. Its API needs a login, so that search runs only when the repository has
# the secrets ZULIP_EMAIL and ZULIP_API_KEY (a Zulip bot on leanprover.zulipchat.com).

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Search for related work
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Search the last 8 days
        env:
          GH_TOKEN: ${{ github.token }}
          ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
          ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
        run: |
          set -euo pipefail
          since="$(date -u -d '8 days ago' +%Y-%m-%d)"
          {
            echo "## Related work since $since"
            echo
            echo "### cslib-frontier issues and pull requests that mention Clay or Millennium"
            gh search issues --repo cslib-community/cslib-frontier --include-prs \
              "Clay OR Millennium OR LeanMillenniumPrizeProblems" --updated ">=$since" \
              --json url,title --jq '.[] | "- [\(.title)](\(.url))"'
            echo
            echo "### konard/p-vs-np commits that mention Clay, Millennium or Lean"
            gh api "repos/konard/p-vs-np/commits?since=${since}T00:00:00Z&per_page=100" \
              --jq '.[] | select(.commit.message | test("(?i)clay|millennium|lean"))
                    | "- \(.html_url) \(.commit.message | split("\n")[0])"'
            if [ -n "${ZULIP_EMAIL:-}" ] && [ -n "${ZULIP_API_KEY:-}" ]; then
              echo
              echo "### Lean Zulip messages that mention Clay, Millennium or cslib-frontier"
              cutoff="$(date -u -d "$since" +%s)"
              for term in "Millennium" "Clay P vs NP" "ClayPVersusNP" "cslib-frontier Clay"; do
                curl -fsS -G -u "$ZULIP_EMAIL:$ZULIP_API_KEY" \
                  https://leanprover.zulipchat.com/api/v1/messages \
                  --data-urlencode anchor=newest --data-urlencode num_before=50 \
                  --data-urlencode num_after=0 \
                  --data-urlencode "narrow=[{\"operator\":\"search\",\"operand\":\"$term\"}]" \
                | jq -r --argjson cutoff "$cutoff" '.messages[] | select(.timestamp >= $cutoff)
                    | "- #\(.display_recipient) > \(.subject) (message \(.id))"'
              done | sort -u
            else
              echo
              echo "_The Lean Zulip was not searched: the ZULIP_EMAIL and ZULIP_API_KEY secrets are not set._"
            fi
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          hits="$(grep -c '^- ' report.md || true)"
          echo "Found $hits items."
          if [ "$hits" -gt 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Weekly watch: $hits related items since $since" --body-file report.md
          fi
